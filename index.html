<script>
const DATA={"questions":[{"text":"Как выглядит твой идеальный активный выходной?","answers":[{"text":"Провести день у воды, попробовать что-нибудь новое и не сидеть на берегу.","points":{"W":2,"A":1}},{"text":"Найти интересное место, до которого можно добраться своим ходом, исследуя окрестности.","points":{"E":2,"R":1}},{"text":"Посвятить день тренировкам, оттачиванию движений и преодолению собственных ограничений.","points":{"T":2,"B":1}},{"text":"Устроить дружеское соревнование, где можно проверить свою реакцию и точность.","points":{"P":2,"A":1}}]},{"text":"Что из этого тебе интереснее всего освоить?","answers":[{"text":"Научиться уверенно держаться на доске и выполнять сложные манёвры.","points":{"B":2,"T":1}},{"text":"Научиться управлять лодкой или плавсредством и проходить сложные маршруты.","points":{"W":2,"E":1}},{"text":"Научиться преодолевать сложные препятствия, используя только своё тело.","points":{"T":2,"E":1}},{"text":"Научиться выполнять точные и быстрые движения, которые приводят к победе.","points":{"P":2,"T":1}}]},{"text":"Как ты относишься к падениям и неудачам во время обучения?","answers":[{"text":"Это часть процесса. Чем больше попыток, тем быстрее научусь.","points":{"A":2,"T":1}},{"text":"Предпочитаю сначала разобраться в технике и только потом пробовать сложное.","points":{"T":2,"P":1}},{"text":"Неудачи не страшны, если я могу спокойно продолжить движение и попробовать ещё раз.","points":{"R":2,"B":1}},{"text":"Мне важно понимать, что риск оправдан и я контролирую ситуацию.","points":{"P":2,"B":1}}]},{"text":"Какое ощущение от движения тебе нравится больше всего?","answers":[{"text":"Скорость, ветер и чувство полного контроля над движением.","points":{"A":2,"B":1}},{"text":"Плавное скольжение, когда каждое движение естественно переходит в следующее.","points":{"R":2,"B":1}},{"text":"Напряжение мышц, когда приходится преодолевать сопротивление и двигаться дальше.","points":{"E":2,"T":1}},{"text":"Резкая смена направления и необходимость мгновенно реагировать.","points":{"P":2,"A":1}}]},{"text":"Представь, что у тебя есть возможность выбрать одну площадку для регулярных занятий. Что выберешь?","answers":[{"text":"Большое открытое пространство с водой и возможностью свободно перемещаться.","points":{"W":2,"E":1}},{"text":"Специально оборудованное пространство с препятствиями, зацепами и разными уровнями сложности.","points":{"T":2,"E":1}},{"text":"Ровную площадку, где можно развивать скорость и отрабатывать манёвры.","points":{"A":2,"B":1}},{"text":"Площадку с разметкой, где можно играть один на один и соревноваться.","points":{"P":2,"T":1}}]},{"text":"Какой формат обучения тебе ближе?","answers":[{"text":"Сразу попробовать, почувствовать движение и учиться на собственном опыте.","points":{"A":2,"R":1}},{"text":"Постепенно осваивать технику, разбирая каждое движение.","points":{"T":2,"P":1}},{"text":"Учиться в собственном темпе, без спешки и постоянного сравнения с другими.","points":{"R":2,"E":1}},{"text":"Получать задания всё сложнее и сложнее, чтобы постоянно проверять свои возможности.","points":{"E":2,"A":1}}]},{"text":"Что тебе интереснее в соревнованиях?","answers":[{"text":"Победить соперника благодаря реакции, расчёту и точности.","points":{"P":2,"T":1}},{"text":"Показать красивую технику и выполнить то, что раньше не получалось.","points":{"T":2,"B":1}},{"text":"Преодолеть сложный маршрут быстрее или эффективнее остальных.","points":{"E":2,"A":1}},{"text":"Получить удовольствие от самого процесса, даже если никто не считает очки.","points":{"R":2,"B":1}}]},{"text":"Какой природный пейзаж вызывает у тебя наибольшее желание оказаться там?","answers":[{"text":"Открытый океан, волны и бесконечный горизонт.","points":{"W":2,"A":1}},{"text":"Спокойное озеро, окружённое лесом.","points":{"W":2,"R":1}},{"text":"Высокие скалы, горы и отвесные стены.","points":{"E":2,"T":1}},{"text":"Просторный городской парк с дорожками и площадками.","points":{"B":2,"A":1}}]},{"text":"Что тебе больше всего нравится в освоении нового навыка?","answers":[{"text":"Момент, когда сложное движение наконец получается идеально.","points":{"T":2,"P":1}},{"text":"Ощущение свободы, когда перестаёшь задумываться о каждом движении.","points":{"R":2,"B":1}},{"text":"Возможность делать то, на что раньше не решался.","points":{"A":2,"E":1}},{"text":"Понимание, что ты становишься лучше других в конкретном навыке.","points":{"P":2,"T":1}}]},{"text":"Какую физическую нагрузку ты предпочитаешь?","answers":[{"text":"Короткие интенсивные усилия с высокой концентрацией.","points":{"A":2,"T":1}},{"text":"Продолжительную нагрузку, когда можно двигаться в своём темпе.","points":{"E":2,"R":1}},{"text":"Чередование активности и отдыха, чтобы сохранять точность и концентрацию.","points":{"P":2,"R":1}},{"text":"Нагрузку, требующую постоянного контроля положения тела и равновесия.","points":{"B":2,"T":1}}]},{"text":"Как ты предпочитаешь проводить время во время путешествий?","answers":[{"text":"Искать необычные активности и пробовать то, чего нет в повседневной жизни.","points":{"A":2,"E":1}},{"text":"Исследовать местность, двигаться по маршрутам и открывать новые места.","points":{"E":2,"R":1}},{"text":"Посещать спортивные площадки, пробовать местные развлечения и соревноваться.","points":{"P":2,"B":1}},{"text":"Находить красивые места и просто наслаждаться движением и окружающей обстановкой.","points":{"R":2,"W":1}}]},{"text":"Какой из этих вызовов кажется тебе наиболее интересным?","answers":[{"text":"Удержаться на небольшой поверхности, сохраняя контроль над каждым движением.","points":{"B":2,"T":1}},{"text":"Пройти сложный маршрут, используя силу, ловкость и смекалку.","points":{"E":2,"T":1}},{"text":"Разогнаться до высокой скорости и сохранить управление.","points":{"A":2,"B":1}},{"text":"Попасть точно в цель, несмотря на давление и ограниченное время.","points":{"P":2,"T":1}}]},{"text":"Какой элемент спортивной активности кажется тебе наиболее привлекательным?","answers":[{"text":"Взаимодействие с природной стихией, которую невозможно полностью контролировать.","points":{"W":2,"A":1}},{"text":"Постоянное движение по поверхности с возможностью менять направление и скорость.","points":{"B":2,"R":1}},{"text":"Преодоление вертикальных препятствий и поиск оптимального пути наверх.","points":{"T":2,"E":1}},{"text":"Игра с соперником, в которой важно предугадывать его действия.","points":{"P":2,"T":1}}]},{"text":"Как бы ты хотел чувствовать себя после хорошей тренировки?","answers":[{"text":"Уставшим, но довольным тем, что смог преодолеть собственный страх.","points":{"A":2,"E":1}},{"text":"Спокойным и расслабленным, словно голова наконец освободилась от лишних мыслей.","points":{"R":2,"W":1}},{"text":"Удовлетворённым от того, что стал технически лучше и освоил новый элемент.","points":{"T":2,"B":1}},{"text":"Заряженным азартом и желанием повторить тренировку, чтобы улучшить результат.","points":{"P":2,"A":1}}]}],"profiles":[{"id":"wakeboard","name":"Вейкборд","weights":{"W":3,"B":3,"A":2,"T":2,"P":0,"E":0,"R":0},"keys":"Водная среда, баланс, адреналин, техника","description":"Тебе нравится скорость, движение и ощущение полного контроля над ситуацией. Ты готов пробовать новое, осваивать сложные элементы и не боишься падений на пути к результату. Тебе подходит активность, в которой сочетаются вода, динамика и техническое мастерство.","why":"Вейкборд объединяет катание по воде за катером или на лебёдке, удержание равновесия, манёвры и постепенное освоение трюков.","alternatives":"Серфинг, скейтбординг"},{"id":"surf","name":"Серфинг","weights":{"W":3,"B":3,"A":2,"T":0,"P":0,"E":0,"R":2},"keys":"Водная среда, баланс, адреналин, ритм","description":"Тебе нравится свобода движения и взаимодействие с природной стихией. Ты умеешь подстраиваться под меняющиеся обстоятельства и ценишь моменты, когда техника и интуиция работают вместе. Тебе интересен процесс, в котором невозможно полностью предсказать следующий момент.","why":"Серфинг требует чувства баланса, умения читать волну, выбирать момент для старта и управлять доской в постоянно меняющихся условиях.","alternatives":"Вейкборд, сапбординг"},{"id":"climbing","name":"Скалодром","weights":{"W":0,"B":2,"A":0,"T":3,"P":1,"E":3,"R":0},"keys":"Техника, исследование, баланс","description":"Тебе нравится решать задачи, которые требуют концентрации, ловкости и продуманной последовательности действий. Ты получаешь удовольствие от постепенного освоения сложных навыков и преодоления собственных ограничений. Для тебя интересен не только результат, но и поиск правильного решения.","why":"Скалолазание на искусственном рельефе сочетает физическую нагрузку, координацию, планирование маршрута и решение двигательных задач.","alternatives":"Скейтбординг, теннис"},{"id":"sup","name":"Сапбординг (SUP)","weights":{"W":3,"B":3,"A":0,"T":0,"P":0,"E":1,"R":3},"keys":"Водная среда, баланс, ритм, исследование","description":"Тебе нравится сочетание движения и спокойствия. Ты ценишь возможность самостоятельно выбирать темп, наслаждаться окружающей обстановкой и при этом оставаться активным. Тебе подходит занятие, в котором физическая активность сочетается со свободой и исследованием новых мест.","why":"Сапбординг позволяет передвигаться по воде стоя на доске с помощью весла. Здесь важны баланс, координация и управление движением.","alternatives":"Каякинг, серфинг"},{"id":"kayak","name":"Каякинг","weights":{"W":3,"B":0,"A":0,"T":1,"P":0,"E":3,"R":3},"keys":"Водная среда, исследование, ритм","description":"Тебе интересно исследовать пространство и двигаться к новым точкам. Ты предпочитаешь продолжительную активность, в которой важны самостоятельность, ритм и умение ориентироваться в окружающей среде. Тебе нравится не только само движение, но и маршрут, который за ним стоит.","why":"Каякинг сочетает греблю, управление лодкой, прохождение маршрутов и взаимодействие с водной средой.","alternatives":"Сапбординг, серфинг"},{"id":"tennis","name":"Теннис","weights":{"W":0,"B":0,"A":2,"T":3,"P":3,"E":2,"R":0},"keys":"Точность, техника, адреналин","description":"Тебе нравится азарт соревнования и возможность влиять на результат за счёт собственных решений. Ты ценишь точность, реакцию и постоянное совершенствование навыков. Тебе интересно не просто двигаться, а просчитывать ситуацию и находить преимущество.","why":"Теннис требует координации, точности ударов, быстроты реакции, тактического мышления и умения адаптироваться к действиям соперника.","alternatives":"Скалодром, коньки"},{"id":"skates","name":"Коньки","weights":{"W":0,"B":3,"A":2,"T":2,"P":0,"E":0,"R":3},"keys":"Баланс, ритм, адреналин, техника","description":"Тебе нравится ощущение скольжения и движения, когда тело работает точно и согласованно. Ты ценишь контроль, плавность и возможность постепенно осваивать новые элементы. При этом тебе не чужды скорость и азарт.","why":"Катание на коньках развивает чувство равновесия, координацию и контроль движения. В зависимости от дисциплины можно сосредоточиться на скорости, манёврах или технических элементах.","alternatives":"Ролики, вейкборд"},{"id":"rollers","name":"Ролики","weights":{"W":0,"B":3,"A":2,"T":0,"P":0,"E":2,"R":3},"keys":"Баланс, ритм, исследование, адреналин","description":"Тебе нравится свобода передвижения и возможность самому выбирать направление и скорость. Ты ценишь движение без жёсткого сценария, любишь исследовать новые маршруты и получать удовольствие от самого процесса. Тебе подходит активность, которую легко вписать в повседневную жизнь.","why":"Катание на роликах сочетает баланс, координацию, манёвренность и возможность перемещаться по самым разным маршрутам.","alternatives":"Коньки, скейтбординг"},{"id":"skateboard","name":"Скейтбординг","weights":{"W":0,"B":3,"A":3,"T":3,"P":0,"E":1,"R":0},"keys":"Баланс, адреналин, техника","description":"Тебе нравится экспериментировать, пробовать сложные элементы и добиваться результата через множество попыток. Ты ценишь самостоятельность, техническое мастерство и возможность выразить себя через движение. Для тебя важно постоянно расширять границы собственных возможностей.","why":"Скейтбординг требует чувства баланса, координации, контроля доски и последовательного освоения трюков.","alternatives":"Вейкборд, ролики"}],"params":{"W":"Водная среда","B":"Баланс","A":"Адреналин","T":"Техника","P":"Точность","E":"Исследование","R":"Ритм"}};
const LETTERS=['A','B','C','D'];let current=0;let answers=Array(DATA.questions.length).fill(null);
const $=id=>document.getElementById(id);const show=id=>{['start','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));};
function renderQuestion(){const q=DATA.questions[current];$('counter').textContent=`Вопрос ${current+1} из ${DATA.questions.length}`;$('percent').textContent=`${Math.round((current+1)/DATA.questions.length*100)}%`;$('progress').style.width=`${(current+1)/DATA.questions.length*100}%`;$('question').textContent=q.text;$('answers').innerHTML='';q.answers.forEach((a,i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.innerHTML=`<span class="letter">${LETTERS[i]}</span><span></span>`;b.querySelector('span:last-child').textContent=a.text;b.addEventListener('click',()=>choose(i));$('answers').appendChild(b)});$('back').style.visibility=current===0?'hidden':'visible';}
function choose(i){answers[current]=i;if(current<DATA.questions.length-1){current++;renderQuestion()}else showResult();}
function calculate(){const scores=Object.fromEntries(Object.keys(DATA.params).map(k=>[k,0]));answers.forEach((a,qi)=>{const pts=DATA.questions[qi].answers[a].points;Object.entries(pts).forEach(([k,v])=>scores[k]+=v)});const ranked=DATA.profiles.map(p=>{const weighted=Object.entries(p.weights).reduce((s,[k,w])=>s+scores[k]*w,0);const weightSum=Object.values(p.weights).reduce((s,w)=>s+w,0);return {...p,score:100*weighted/(28*weightSum)}}).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'ru'));return {scores,ranked};}
function showResult(){const {scores,ranked}=calculate();const top=ranked[0];const tied=ranked.filter(p=>Math.abs(p.score-top.score)<1e-9);const second=ranked.find(p=>!tied.some(t=>t.id===p.id));const close=!!second && top.score-second.score<3;let leadHtml='';if(tied.length>1){leadHtml=`<div class="close"><strong class="tie">Совместные лидеры: ${tied.map(p=>p.name).join(' и ')}</strong><br>У этих видов спорта одинаковый процент соответствия. Тест не выбирает победителя случайным образом.</div>`}else if(close){leadHtml=`<div class="close">Результаты близкие: разница между первым и вторым местом меньше 3 процентных пунктов. Оба варианта могут тебе подойти.</div>`}
const main=tied.length>1?tied[0]:top;const alt=tied.length>1?tied.slice(1):second?[second]:[];const topNames=tied.length>1?tied.map(p=>p.name).join(' / '):top.name;
const bars=Object.entries(DATA.params).map(([k,n])=>({name:n,value:scores[k]})).sort((a,b)=>b.value-a.value);
let html=`<div class="result-kicker">Твой результат</div><h2>${topNames}</h2><div class="score">${top.score.toFixed(1).replace('.',',')}% совпадения${tied.length>1?' · одинаковый результат':''}</div><p>${main.description}</p><div class="section-title">Почему подходит</div><p>${main.why}</p>${leadHtml}<div class="section-title">Твой профиль</div><div class="bars">${bars.map(x=>`<div class="barrow"><span class="barname">${x.name}</span><div class="bartrack"><div class="barfill" style="width:${x.value/28*100}%"></div></div><span class="barval">${x.value}/28</span></div>`).join('')}</div>`;
if(alt.length){html+=`<div class="section-title">${tied.length>1?'Другие совместные лидеры':'Альтернативный результат'}</div>`+alt.map(p=>`<div class="alt"><strong>${p.name} · ${p.score.toFixed(1).replace('.',',')}%</strong><small>${p.description}</small><p>${p.why}</p></div>`).join('')}
html+=`<div class="result-actions"><button class="btn" id="restart">Пройти ещё раз</button><button class="btn secondary" id="share">Поделиться результатом</button></div><p class="note">Проценты показывают математическое соответствие ответов весам из модели, а не вероятность успеха или объективную оценку спортивных способностей.</p>`;$('result').innerHTML=html;show('result');$('restart').addEventListener('click',restart);$('share').addEventListener('click',()=>shareResult(topNames,top.score));}
function restart(){answers=Array(DATA.questions.length).fill(null);current=0;show('start')}
async function shareResult(name,score){const text=`Мой результат в тесте «Какой вид спорта тебе подходит?» — ${name} (${score.toFixed(1).replace('.',',')}%).`;try{if(navigator.share)await navigator.share({title:'Мой спортивный результат',text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);$('share').textContent='Скопировано'}else{$('share').textContent='Не удалось поделиться'}}catch(e){if(e.name!=='AbortError')$('share').textContent='Не удалось поделиться'}}
$('begin').addEventListener('click',()=>{current=0;show('quiz');renderQuestion()});$('back').addEventListener('click',()=>{if(current>0){current--;renderQuestion()}});
</script></body></html>
